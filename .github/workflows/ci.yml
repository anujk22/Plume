name: validate plume

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: verify scientific source assets
        run: |
          python -m pip install numpy rasterio Pillow matplotlib contourpy
          python scripts/verify_release.py
          python scripts/prepare_global_catalog.py --check
          python scripts/prepare_home_plumes.py --check
          python scripts/prepare_santiago_plumes.py --check
          python scripts/prepare_santiago_plumes.py --investigations --check
          git diff --exit-code -- research/release-validation.json
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
